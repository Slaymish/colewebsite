name: Infrastructure

# Infrastructure changes rarely and is never deployed by a content push, so this
# is manual on purpose.
on:
  workflow_dispatch:
    inputs:
      command:
        description: diff or deploy
        required: true
        default: diff
        type: choice
        options: [diff, deploy]

permissions:
  id-token: write
  contents: read

jobs:
  cdk:
    environment: infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ap-southeast-2
      # pnpm exec, never npx. When infra's install is broken there is no local
      # cdk binary, and npx answers that by fetching the toolkit from the registry
      # and running on: the app then dies on a missing aws-cdk-lib rather than on
      # the install that actually failed. pnpm exec fails at the binary instead.
      #
      # OIDC_PROVIDER_ARN is not optional. This AWS account already holds a
      # GitHub OIDC provider — one per URL is the limit — so without it CDK plans
      # a second one and the deploy fails.
      #
      # zoneName, hostedZoneId, certificateArn and basicAuthHeader may all be
      # empty: bin/infra.ts then declares the OIDC stack alone and skips the
      # site stacks, which is the correct state until the hosted zone and the
      # certificate exist.
      #
      # EXTERNAL_APEX_IPS holds the addresses of whoever is serving the apex
      # while this site is not — Cole's Adobe Portfolio today. Emptying it hands
      # the apex and www back to CloudFront on the next deploy, so it is a
      # settings change and not a commit. Do not empty it by forgetting: the run
      # would fail creating an alias over records another stack still owns.
      #
      # --all is a deploy-only option. `cdk diff` already diffs every stack in the
      # app, and passing it there earns "Unknown option(s): --all" and nothing else.
      - name: Run CDK
        run: |
          pnpm exec cdk ${{ github.event.inputs.command }} \
            ${{ github.event.inputs.command == 'deploy' && '--all --require-approval never' || '' }} \
            -c account=${{ secrets.AWS_ACCOUNT_ID }} \
            -c zoneName=${{ vars.ZONE_NAME }} \
            -c hostedZoneId=${{ secrets.HOSTED_ZONE_ID }} \
            -c certificateArn=${{ secrets.CERTIFICATE_ARN }} \
            -c repository=${{ github.repository }} \
            -c basicAuthHeader='${{ secrets.TEST_BASIC_AUTH_HEADER }}' \
            -c externalApexIps='${{ vars.EXTERNAL_APEX_IPS }}' \
            -c oidcProviderArn=${{ secrets.OIDC_PROVIDER_ARN }} \
            -c ownerId=${{ github.repository_owner_id }} \
            -c repositoryId=${{ github.repository_id }}
